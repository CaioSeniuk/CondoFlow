name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest

    # Postgres efêmero, só para o teste de concorrência de reserva. Sem relação com
    # o Supabase real — a pipeline nunca lê nem escreve dados de usuário.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Só gera o client a partir do schema versionado — a pipeline nunca conecta
      # no Supabase real nem lê dados de usuário.
      - run: npx prisma generate

      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: npm run lint:check

      - run: npm run typecheck

      # Cria o schema no Postgres efêmero para o teste de concorrência de reserva.
      - name: Prepara o banco de teste
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm run test -- --runInBand

      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem (sem push)
        run: docker build -t condoflow-backend:ci .
